name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --platforms=android --org com.lyricplayer --project-name lyric_player
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: App icon
        run: |
          R=android/app/src/main/res
          mkdir -p /tmp/icons
          ok=1
          [ -f icon.png ] || ok=0
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; sz=${pair##*:}
            mkdir -p /tmp/icons/mipmap-$d
            if command -v magick >/dev/null 2>&1; then
              magick icon.png -resize ${sz}x${sz} /tmp/icons/mipmap-$d/ic_launcher.png || ok=0
            elif command -v convert >/dev/null 2>&1; then
              convert icon.png -resize ${sz}x${sz} /tmp/icons/mipmap-$d/ic_launcher.png || ok=0
            else
              python3 -m pip install --quiet --break-system-packages pillow && python3 -c "from PIL import Image; Image.open('icon.png').convert('RGB').resize(($sz,$sz), Image.LANCZOS).save('/tmp/icons/mipmap-$d/ic_launcher.png')" || ok=0
            fi
          done
          if [ "$ok" = "1" ] && [ -f /tmp/icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            rm -rf $R/mipmap-anydpi* $R/mipmap-*/ic_launcher.*
            cp -r /tmp/icons/* $R/
            echo "icon installed"
          else
            echo "icon skipped, default icon kept"
          fi

      - name: Android permissions, audio service and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' $M
          sed -i 's|</application>|<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service>\n        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver>\n    </application>|' $M
          sed -i 's|android:label="[^"]*"|android:label="مشغل الكلمات"|' $M
          cat $M

      - name: Open-with audio intent filter
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</activity>|<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="content"/><data android:scheme="file"/><data android:mimeType="audio/*"/><data android:mimeType="application/ogg"/></intent-filter>\n        </activity>|' $M
          grep -n "mimeType" $M

      - name: Custom MainActivity (audio service + open-with)
        run: |
          F=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          PKG=$(grep -m1 '^package ' "$F")
          echo "$PKG" > "$F"
          cat >> "$F" <<'EOF'

          import android.content.Intent
          import android.provider.OpenableColumns
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : AudioServiceActivity() {
              private var channel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lyricplayer/open")
                  ch.setMethodCallHandler { call, result ->
                      if (call.method == "initial") {
                          result.success(describe(intent))
                      } else if (call.method == "diag") {
                          result.success(diag())
                      } else {
                          result.notImplemented()
                      }
                  }
                  channel = ch
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val d = describe(intent)
                  if (d != null) channel?.invokeMethod("opened", d)
              }

              private fun describe(i: Intent?): Map<String, Any?>? {
                  if (i == null || i.action != Intent.ACTION_VIEW) return null
                  val data = i.data ?: return null
                  i.action = Intent.ACTION_MAIN
                  var name: String? = null
                  var size: Long? = null
                  try {
                      contentResolver.query(data, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              val si = c.getColumnIndex(OpenableColumns.SIZE)
                              if (ni >= 0) name = c.getString(ni)
                              if (si >= 0 && !c.isNull(si)) size = c.getLong(si)
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return mapOf(
                      "uri" to data.toString(),
                      "name" to (name ?: data.lastPathSegment),
                      "size" to size
                  )
              }

              @Suppress("DEPRECATION")
              private fun diag(): String {
                  val sb = StringBuilder()
                  sb.append("device: ").append(android.os.Build.MANUFACTURER).append(" ")
                      .append(android.os.Build.MODEL).append(" / sdk ")
                      .append(android.os.Build.VERSION.SDK_INT).append("\n")
                  try {
                      val nm = getSystemService(android.content.Context.NOTIFICATION_SERVICE) as android.app.NotificationManager
                      sb.append("notifications enabled: ").append(nm.areNotificationsEnabled()).append("\n")
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          for (c in nm.notificationChannels) {
                              sb.append("channel ").append(c.id).append(" importance=")
                                  .append(c.importance).append("\n")
                          }
                      }
                      for (n in nm.activeNotifications) {
                          sb.append("active notification id=").append(n.id).append("\n")
                      }
                  } catch (e: Throwable) {
                      sb.append("notification info error: ").append(e.toString()).append("\n")
                  }
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          val am = getSystemService(android.content.Context.ACTIVITY_SERVICE) as android.app.ActivityManager
                          for (e in am.getHistoricalProcessExitReasons(packageName, 0, 8)) {
                              val name = when (e.reason) {
                                  1 -> "EXIT_SELF"
                                  2 -> "SIGNALED"
                                  3 -> "LOW_MEMORY"
                                  4 -> "CRASH"
                                  5 -> "CRASH_NATIVE"
                                  6 -> "ANR"
                                  7 -> "INITIALIZATION_FAILURE"
                                  8 -> "PERMISSION_CHANGE"
                                  9 -> "EXCESSIVE_RESOURCE_USAGE"
                                  10 -> "USER_REQUESTED"
                                  11 -> "USER_STOPPED"
                                  12 -> "DEPENDENCY_DIED"
                                  13 -> "OTHER"
                                  14 -> "FREEZER"
                                  15 -> "PACKAGE_STATE_CHANGE"
                                  16 -> "PACKAGE_UPDATED"
                                  else -> "UNKNOWN"
                              }
                              sb.append("exit: ").append(java.util.Date(e.timestamp).toString())
                                  .append(" reason=").append(name)
                                  .append(" status=").append(e.status)
                                  .append(" importance=").append(e.importance)
                                  .append(" desc=").append(e.description).append("\n")
                          }
                      }
                  } catch (e: Throwable) {
                      sb.append("exit reasons error: ").append(e.toString()).append("\n")
                  }
                  try {
                      val ci = android.content.ComponentName(packageName, "com.ryanheise.audioservice.AudioService")
                      val si = packageManager.getServiceInfo(ci, 0)
                      sb.append("audio service declared: exported=").append(si.exported)
                      if (android.os.Build.VERSION.SDK_INT >= 29) {
                          sb.append(" fgsType=").append(si.foregroundServiceType)
                      }
                      sb.append("\n")
                  } catch (e: Throwable) {
                      sb.append("audio service declared: NO ").append(e.toString()).append("\n")
                  }
                  try {
                      val pi = packageManager.getPackageInfo(packageName, android.content.pm.PackageManager.GET_PERMISSIONS)
                      val perms = pi.requestedPermissions
                      if (perms != null) {
                          for (perm in perms) {
                              if (perm.contains("FOREGROUND") || perm.contains("NOTIFICATION") || perm.contains("WAKE")) {
                                  sb.append("perm: ").append(perm).append("\n")
                              }
                          }
                      }
                  } catch (e: Throwable) {
                      sb.append("perm list error: ").append(e.toString()).append("\n")
                  }
                  try {
                      val am2 = getSystemService(android.content.Context.ACTIVITY_SERVICE) as android.app.ActivityManager
                      var count = 0
                      for (s in am2.getRunningServices(100)) {
                          count++
                          sb.append("running service: ").append(s.service.className)
                              .append(" foreground=").append(s.foreground).append("\n")
                      }
                      if (count == 0) sb.append("running services: none\n")
                  } catch (e: Throwable) {
                      sb.append("running services error: ").append(e.toString()).append("\n")
                  }
                  return sb.toString()
              }
          }
          EOF
          cat "$F"

      - name: Relax Kotlin JVM target check
        run: printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties

      - name: Use fixed signing key
        run: |
          mkdir -p $HOME/.android
          cp debug.keystore $HOME/.android/debug.keystore

      - run: flutter pub get

      - name: Patch on_audio_query for new Gradle
        run: |
          D=$(grep -o 'file://[^"]*on_audio_query_android[^"]*' .dart_tool/package_config.json | head -1 | sed 's|file://||')
          echo "plugin dir: $D"
          ls "$D/android"
          for f in "$D/android/build.gradle" "$D/android/build.gradle.kts"; do
            [ -f "$f" ] || continue
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f"
            sed -i 's/VERSION_[0-9_]*/VERSION_17/g' "$f"
            sed -i "s/jvmTarget *= *'[^']*'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget *= *"[^"]*"/jvmTarget = "17"/g' "$f"
            grep -q 'namespace' "$f" || sed -i '0,/android {/s//android {\n    namespace "com.lucasjosino.on_audio_query"/' "$f"
            echo "=== $f ==="
            cat "$f"
          done
          sed -i 's/package="[^"]*"//' "$D/android/src/main/AndroidManifest.xml" || true

      - name: Raise compileSdk for all plugins
        run: |
          for D in $(grep -o 'file://[^"]*' .dart_tool/package_config.json | sed 's|file://||'); do
            for f in "$D/android/build.gradle" "$D/android/build.gradle.kts"; do
              [ -f "$f" ] || continue
              perl -pi -e 's/(compileSdk(?:Version)?[ =(]+)\d+/${1}36/' "$f"
              echo "patched: $f"
            done
          done

      - run: flutter build apk --release --no-shrink

      - name: Check merged manifest
        run: |
          M=$(find build/app/intermediates -name AndroidManifest.xml -path '*merged_manifests/release*' | head -1)
          echo "merged manifest: $M"
          grep -n -i "audioservice\|FOREGROUND\|POST_NOTIFICATIONS\|MEDIA_BUTTON\|android:icon\|MainActivity" "$M" || true

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lyrics Player v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
