name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --platforms=android --org com.lyricplayer --project-name lyric_player
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: App icon
        run: |
          R=android/app/src/main/res
          mkdir -p /tmp/icons
          ok=1
          [ -f icon.png ] || ok=0
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; sz=${pair##*:}
            mkdir -p /tmp/icons/mipmap-$d
            if command -v magick >/dev/null 2>&1; then
              magick icon.png -resize ${sz}x${sz} /tmp/icons/mipmap-$d/ic_launcher.png || ok=0
            elif command -v convert >/dev/null 2>&1; then
              convert icon.png -resize ${sz}x${sz} /tmp/icons/mipmap-$d/ic_launcher.png || ok=0
            else
              python3 -m pip install --quiet --break-system-packages pillow && python3 -c "from PIL import Image; Image.open('icon.png').convert('RGB').resize(($sz,$sz), Image.LANCZOS).save('/tmp/icons/mipmap-$d/ic_launcher.png')" || ok=0
            fi
          done
          if [ "$ok" = "1" ] && [ -f /tmp/icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            rm -rf $R/mipmap-anydpi* $R/mipmap-*/ic_launcher.*
            cp -r /tmp/icons/* $R/
            echo "icon installed"
          else
            echo "icon skipped, default icon kept"
          fi

      - name: Android permissions, audio service and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' $M
          sed -i 's|</application>|<service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service>\n        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver>\n    </application>|' $M
          sed -i 's|android:label="[^"]*"|android:label="مشغل الكلمات"|' $M
          cat $M

      - name: Open-with audio intent filter
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</activity>|<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="content"/><data android:scheme="file"/><data android:mimeType="audio/*"/><data android:mimeType="application/ogg"/><data android:mimeType="video/*"/><data android:mimeType="application/x-matroska"/></intent-filter>\n        </activity>|' $M
          grep -n "mimeType" $M

      - name: Custom MainActivity (audio service + open-with)
        run: |
          F=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          PKG=$(grep -m1 '^package ' "$F")
          echo "$PKG" > "$F"
          cat >> "$F" <<'EOF'

          import android.content.Intent
          import android.provider.OpenableColumns
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : AudioServiceActivity() {
              private var channel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lyricplayer/open")
                  ch.setMethodCallHandler { call, result ->
                      if (call.method == "initial") {
                          result.success(describe(intent))
                      } else if (call.method == "version") {
                          result.success(versionInfo())
                      } else if (call.method == "cacheDir") {
                          result.success(cacheDir.absolutePath)
                      } else if (call.method == "install") {
                          result.success(installApk(call.argument<String>("path") ?: ""))
                      } else if (call.method == "keepScreen") {
                          val on = call.argument<Boolean>("on") ?: false
                          runOnUiThread {
                              if (on) {
                                  window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                              } else {
                                  window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                              }
                          }
                          result.success(true)
                      } else if (call.method == "scan") {
                          val list = call.argument<List<String>>("paths")
                          val paths = (list ?: emptyList()).toTypedArray()
                          if (paths.isEmpty()) {
                              result.success(true)
                          } else {
                              var left = paths.size
                              android.media.MediaScannerConnection.scanFile(this, paths, null) { _, _ ->
                                  var finished = false
                                  synchronized(this) {
                                      left -= 1
                                      finished = left == 0
                                  }
                                  if (finished) runOnUiThread { result.success(true) }
                              }
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
                  channel = ch
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val d = describe(intent)
                  if (d != null) channel?.invokeMethod("opened", d)
              }

              private var installReceiver: android.content.BroadcastReceiver? = null

              @Suppress("DEPRECATION")
              private fun versionInfo(): Map<String, Any?> {
                  val pi = packageManager.getPackageInfo(packageName, 0)
                  val code: Long = if (android.os.Build.VERSION.SDK_INT >= 28) pi.longVersionCode else pi.versionCode.toLong()
                  return mapOf("name" to pi.versionName, "code" to code)
              }

              @Suppress("DEPRECATION")
              private fun installApk(path: String): String {
                  try {
                      val file = java.io.File(path)
                      if (!file.exists()) return "missing"
                      if (android.os.Build.VERSION.SDK_INT >= 26 && !packageManager.canRequestPackageInstalls()) {
                          val i = Intent(
                              android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              android.net.Uri.parse("package:" + packageName)
                          )
                          startActivity(i)
                          return "need_permission"
                      }
                      val installer = packageManager.packageInstaller
                      val params = android.content.pm.PackageInstaller.SessionParams(
                          android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL
                      )
                      val sid = installer.createSession(params)
                      val session = installer.openSession(sid)
                      try {
                          java.io.FileInputStream(file).use { input ->
                              session.openWrite("update.apk", 0, file.length()).use { out ->
                                  input.copyTo(out)
                                  session.fsync(out)
                              }
                          }
                          val action = packageName + ".INSTALL_RESULT"
                          if (installReceiver == null) {
                              val r = object : android.content.BroadcastReceiver() {
                                  override fun onReceive(context: android.content.Context, intent: Intent) {
                                      val status = intent.getIntExtra(android.content.pm.PackageInstaller.EXTRA_STATUS, -1)
                                      if (status == android.content.pm.PackageInstaller.STATUS_PENDING_USER_ACTION) {
                                          val confirm = intent.getParcelableExtra<Intent>(Intent.EXTRA_INTENT)
                                          if (confirm != null) {
                                              confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                              context.startActivity(confirm)
                                          }
                                      } else {
                                          val msg = intent.getStringExtra(android.content.pm.PackageInstaller.EXTRA_STATUS_MESSAGE)
                                          channel?.invokeMethod("installStatus", mapOf("status" to status, "message" to msg))
                                      }
                                  }
                              }
                              val filter = android.content.IntentFilter(action)
                              if (android.os.Build.VERSION.SDK_INT >= 33) {
                                  registerReceiver(r, filter, android.content.Context.RECEIVER_NOT_EXPORTED)
                              } else {
                                  registerReceiver(r, filter)
                              }
                              installReceiver = r
                          }
                          val pending = android.app.PendingIntent.getBroadcast(
                              this, sid, Intent(action).setPackage(packageName),
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                          )
                          session.commit(pending.intentSender)
                      } finally {
                          session.close()
                      }
                      return "started"
                  } catch (e: Throwable) {
                      return "error:" + e.toString()
                  }
              }

              override fun onDestroy() {
                  val r = installReceiver
                  if (r != null) {
                      try {
                          unregisterReceiver(r)
                      } catch (e: Exception) {
                      }
                      installReceiver = null
                  }
                  super.onDestroy()
              }

              private fun describe(i: Intent?): Map<String, Any?>? {
                  if (i == null || i.action != Intent.ACTION_VIEW) return null
                  val data = i.data ?: return null
                  i.action = Intent.ACTION_MAIN
                  var name: String? = null
                  var size: Long? = null
                  try {
                      contentResolver.query(data, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              val si = c.getColumnIndex(OpenableColumns.SIZE)
                              if (ni >= 0) name = c.getString(ni)
                              if (si >= 0 && !c.isNull(si)) size = c.getLong(si)
                          }
                      }
                  } catch (e: Exception) {
                  }
                  val mime: String? = try { contentResolver.getType(data) } catch (e: Exception) { null }
                  var path: String? = null
                  if (data.scheme == "file") {
                      path = data.path
                  } else {
                      try {
                          contentResolver.query(data, arrayOf("_data"), null, null, null)?.use { c ->
                              if (c.moveToFirst()) {
                                  val di = c.getColumnIndex("_data")
                                  if (di >= 0) path = c.getString(di)
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return mapOf(
                      "uri" to data.toString(),
                      "name" to (name ?: data.lastPathSegment),
                      "size" to size,
                      "mime" to mime,
                      "path" to path
                  )
              }
          }
          EOF
          cat "$F"

      - name: Keep audio_service icons (resource shrinker strips them)
        run: |
          mkdir -p android/app/src/main/res/raw
          cat > android/app/src/main/res/raw/keep.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:shrinkMode="lax"
              tools:keep="@drawable/audio_service_*,@mipmap/ic_launcher" />
          EOF
          cat android/app/src/main/res/raw/keep.xml

      - name: Relax Kotlin JVM target check
        run: printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties

      - name: Use fixed signing key (fallback)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p $HOME/.android
            cp debug.keystore $HOME/.android/debug.keystore
          fi

      - run: flutter pub get

      - name: Patch on_audio_query for new Gradle
        run: |
          D=$(grep -o 'file://[^"]*on_audio_query_android[^"]*' .dart_tool/package_config.json | head -1 | sed 's|file://||')
          echo "plugin dir: $D"
          ls "$D/android"
          for f in "$D/android/build.gradle" "$D/android/build.gradle.kts"; do
            [ -f "$f" ] || continue
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f"
            sed -i 's/VERSION_[0-9_]*/VERSION_17/g' "$f"
            sed -i "s/jvmTarget *= *'[^']*'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget *= *"[^"]*"/jvmTarget = "17"/g' "$f"
            grep -q 'namespace' "$f" || sed -i '0,/android {/s//android {\n    namespace "com.lucasjosino.on_audio_query"/' "$f"
            echo "=== $f ==="
            cat "$f"
          done
          sed -i 's/package="[^"]*"//' "$D/android/src/main/AndroidManifest.xml" || true

      - name: Raise compileSdk for all plugins
        run: |
          for D in $(grep -o 'file://[^"]*' .dart_tool/package_config.json | sed 's|file://||'); do
            for f in "$D/android/build.gradle" "$D/android/build.gradle.kts"; do
              [ -f "$f" ] || continue
              perl -pi -e 's/(compileSdk(?:Version)?[ =(]+)\d+/${1}36/' "$f"
              echo "patched: $f"
            done
          done

      - name: Read version from VERSION file
        id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          IFS=. read MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))" >> "$GITHUB_OUTPUT"
          echo "version $V code $((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))"

      - name: Build APK
        run: flutter build apk --release --no-shrink --build-number=${{ steps.ver.outputs.code }} --build-name=${{ steps.ver.outputs.name }} --dart-define=GH_REPO=${{ github.repository }}

      # توقيع ثابت بعد البناء: نفس المفتاح كل مرة حتى أندرويد يقبل التحديث فوق القديم
      - name: Sign APK with fixed key
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f signing/release.jks.enc ]; then
            echo "no encrypted key in repo: keeping the old signature"
            exit 0
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::signing/release.jks.enc موجود بس سر KEYSTORE_PASSWORD مو مضاف بالمستودع"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias exam \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Show APK signer
        run: |
          AS=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$AS" ] && "$AS" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5 || echo "apksigner not found"

      - name: Check merged manifest
        run: |
          M=$(find build/app/intermediates -name AndroidManifest.xml -path '*merged_manifests/release*' | head -1)
          echo "merged manifest: $M"
          grep -n -i "audioservice\|FOREGROUND\|POST_NOTIFICATIONS\|MEDIA_BUTTON\|android:icon\|MainActivity" "$M" || true

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Lyrics Player v${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/app-release.apk
