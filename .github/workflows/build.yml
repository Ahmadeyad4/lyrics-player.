name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --platforms=android --org com.lyricplayer --project-name lyric_player
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: Android permissions and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="Lyrics Player"|' $M

      - name: Relax Kotlin JVM target check
        run: printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties

      - run: flutter pub get

      - name: Patch on_audio_query for new Gradle
        run: |
          D=$(grep -o 'file://[^"]*on_audio_query_android[^"]*' .dart_tool/package_config.json | head -1 | sed 's|file://||')
          echo "plugin dir: $D"
          ls "$D/android"
          for f in "$D/android/build.gradle" "$D/android/build.gradle.kts"; do
            [ -f "$f" ] || continue
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f"
            sed -i 's/VERSION_[0-9_]*/VERSION_17/g' "$f"
            sed -i "s/jvmTarget *= *'[^']*'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget *= *"[^"]*"/jvmTarget = "17"/g' "$f"
            grep -q 'namespace' "$f" || sed -i '0,/android {/s//android {\n    namespace "com.lucasjosino.on_audio_query"/' "$f"
            echo "=== $f ==="
            cat "$f"
          done
          sed -i 's/package="[^"]*"//' "$D/android/src/main/AndroidManifest.xml" || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lyrics Player v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
