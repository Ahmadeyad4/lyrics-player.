name: lyric_player
description: مشغل موسيقى مع كلمات متزامنة
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ">=0.9.40 <0.11.0"
  audio_service: ^0.18.15
  file_picker: ^8.1.2
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"

flutter:
  uses-material-design: true
